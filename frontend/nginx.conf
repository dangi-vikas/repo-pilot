# =============================================================================
# RepoPilot frontend server.
#
# The SPA is served from this origin and /api + /actuator are proxied to the
# backend container, so the browser never makes a cross-origin request and the
# backend needs no CORS configuration in this configuration.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Analysis artifacts are not uploaded through the browser today, so this is
    # a ceiling rather than a requirement: a proxy default of 1m would break the
    # first feature that posts a JFR file.
    client_max_body_size 32m;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- security headers -------------------------------------------------
    # script-src is 'self' with no inline scripts: the Vite build emits external
    # modules only. style-src has to allow inline because the React components
    # set style attributes directly. connect-src is 'self' because the API is
    # same-origin through this proxy.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Jobs are streamed and can legitimately run for minutes; the connection
        # is held open rather than cut at the proxy default.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # Health and metrics. Exposed by design: the connection gate reads
    # readiness, and the compose file publishes this port on loopback only.
    location /actuator/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- static assets -----------------------------------------------------
    # Vite fingerprints every file name, so a hashed asset can never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a rebuild would keep serving the old
    # bundle references.
    location = /index.html {
        add_header Cache-Control "no-store";
        expires -1;
    }

    # Client-side routing: every unknown path is the application, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
