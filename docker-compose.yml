# =============================================================================
# RepoPilot - local-first deployment.
#
#   docker compose up --build
#
# Then open http://127.0.0.1:3000 (the SPA) or http://127.0.0.1:8080/api/docs
# (the API reference). Both ports are published on loopback only: RepoPilot is a
# single-operator tool and nothing here is meant to be reachable from a network.
#
# The backend requires a bearer token. Because it binds 0.0.0.0 inside the
# container, Docker Compose needs an explicit token: copy .env.example to .env
# and set REPOPILOT_AUTH_TOKEN to at least 16 characters. A generated token is
# refused on a non-loopback bind. The published ports are loopback-only.
#
# Every other variable below has a working default.
# =============================================================================

name: repopilot

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-repopilot}
      POSTGRES_USER: ${POSTGRES_USER:-repopilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-a-real-deployment}
      # Deterministic collation keeps index ordering identical across machines,
      # which matters because RepoPilot pages results by name.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The container is only "healthy" when a real connection succeeds with the
      # configured credentials, not merely when the port is open.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    # No published port: the database is reachable only from this compose network.
    expose:
      - "5432"

  backend:
    build:
      context: ./backend
    image: repopilot/backend:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      # 0.0.0.0 inside the container; the published port below is loopback-only,
      # so the effective exposure is unchanged from the bare-metal default.
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
      # Required by StartupSecurityValidator for the non-loopback container
      # bind. The host port is still published on 127.0.0.1 only.
      REPOPILOT_SECURITY_ALLOW_REMOTE_BIND: "true"

      REPOPILOT_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-repopilot}
      REPOPILOT_DB_USERNAME: ${POSTGRES_USER:-repopilot}
      REPOPILOT_DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-a-real-deployment}

      # Required. Set this in .env to a strong value of at least 16 characters.
      # Do not rely on a generated token here: the validator rejects generated
      # tokens on a non-loopback bind.
      REPOPILOT_AUTH_TOKEN: "${REPOPILOT_AUTH_TOKEN:?Set REPOPILOT_AUTH_TOKEN in .env to at least 16 characters}"

      REPOPILOT_DATA_DIR: /data
      # The only directory a job is allowed to read a repository from. Files are
      # mounted read-only, and the sandbox re-checks every resolved path against
      # this root, symlinks included.
      REPOPILOT_WORKSPACE_ROOTS: /workspace
      REPOPILOT_MAX_FILES_PER_REPOSITORY: ${REPOPILOT_MAX_FILES_PER_REPOSITORY:-20000}
      REPOPILOT_JOBS_WORKER_THREADS: ${REPOPILOT_JOBS_WORKER_THREADS:-3}

      # Ollama on the host, not in this compose file: the model runtime is a
      # user-owned, long-lived process with its own model store. RepoPilot works
      # without it; only AI Investigation needs it.
      REPOPILOT_AI_ENABLED: ${REPOPILOT_AI_ENABLED:-true}
      REPOPILOT_AI_PROVIDER: ${REPOPILOT_AI_PROVIDER:-ollama}
      REPOPILOT_AI_BASE_URL: ${REPOPILOT_AI_BASE_URL:-http://host.docker.internal:11434}
      REPOPILOT_AI_CHAT_MODEL: ${REPOPILOT_AI_CHAT_MODEL:-qwen2.5-coder:7b}

      REPOPILOT_LOG_LEVEL: ${REPOPILOT_LOG_LEVEL:-INFO}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - repopilot-data:/data
      # Read a repository from the host. Point REPOPILOT_WORKSPACE_HOST_DIR at the
      # parent directory that contains the repositories you want to analyse.
      - ${REPOPILOT_WORKSPACE_HOST_DIR:-./examples}:/workspace:ro
    ports:
      - "127.0.0.1:8080:8080"
    # Lets the default Ollama URL work on Linux as well as Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The JVM gets a real PID 1 semantics wrapper so SIGTERM reaches Spring's
    # graceful shutdown instead of being swallowed by the shell.
    init: true

  frontend:
    build:
      context: ./frontend
    image: repopilot/frontend:local
    restart: unless-stopped
    depends_on:
      backend:
        # nginx resolves the `backend` name at request time, so it does not need
        # the API to be ready before it starts serving static files.
        condition: service_started
    ports:
      - "127.0.0.1:3000:80"

volumes:
  postgres-data:
  repopilot-data:
